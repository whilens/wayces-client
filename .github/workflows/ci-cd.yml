# CI/CD для репозитория wayces-client (отдельный репо).
# Секреты: DOCKERHUB_USERNAME, DOCKERHUB_TOKEN, VPS_HOST, VPS_USER, VPS_SSH_PASSWORD (для входа по паролю).
name: CI/CD

on:
  push:
    branches: [main, qa, develop]
  pull_request:
    branches: [main, qa, develop]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm i && CI=false npm run build

  docker:
    needs: check
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
пше     outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - id: version
        run: echo "version=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Build and push
        run: |
          docker build -t ${{ secrets.DOCKERHUB_USERNAME }}/wayces-client:${{ github.ref_name }} \
            --build-arg REACT_APP_API_URL=/api \
            --build-arg REACT_APP_FRONTEND_VERSION=${{ steps.version.outputs.version }} .
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/wayces-client:${{ github.ref_name }}

  deploy:
    needs: docker
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/qa')
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to VPS
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          password: ${{ secrets.VPS_SSH_PASSWORD }}
          script: |
            FRONTEND_VERSION='${{ needs.docker.outputs.version }}'
            if [ "${{ github.ref_name }}" = "main" ]; then
              CDIR="/var/www/docker_wayces"
              PNAME="waycess"
            else
              CDIR="/var/www/docker_wayces_qa"
              PNAME="waycess-qa"
            fi
            cd "$CDIR"
            if [ -n "$FRONTEND_VERSION" ]; then
              if grep -q '^FRONTEND_VERSION=' .env 2>/dev/null; then
                sed -i "s/^FRONTEND_VERSION=.*/FRONTEND_VERSION=$FRONTEND_VERSION/" .env
              else
                echo "FRONTEND_VERSION=$FRONTEND_VERSION" >> .env
              fi
            fi
            BRANCH=${{ github.ref_name }} docker compose -p $PNAME -f docker-compose.yml pull client
            BRANCH=${{ github.ref_name }} docker compose -p $PNAME -f docker-compose.yml up -d client
            [ -n "$FRONTEND_VERSION" ] && BRANCH=${{ github.ref_name }} docker compose -p $PNAME -f docker-compose.yml up -d server
            docker image prune -f